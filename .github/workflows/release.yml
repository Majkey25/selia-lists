name: Preview release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --console=plain
      - name: Prepare assets
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "sheetset-${GITHUB_REF_NAME}-debug.apk"
          sha256sum "sheetset-${GITHUB_REF_NAME}-debug.apk" > "sheetset-${GITHUB_REF_NAME}-debug.apk.sha256"
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "sheetset-${GITHUB_REF_NAME}-debug.apk"
          "sheetset-${GITHUB_REF_NAME}-debug.apk.sha256"
          --prerelease
          --generate-notes
          --title "SheetSet $GITHUB_REF_NAME"
